bridge:
  name: "bridge-windows"
  log_level: "INFO"

cache:
  enabled: true

security:
  rate_limit_per_minute: 60
  write_rate_limit: 10
  fail_ban_threshold: 5
  fail_ban_seconds: 30

ui:
  auto_open: true

auth:
  token: "${BRIDGE_AUTH_TOKEN}"
  # 额外 token (逗号分隔, 支持多客户端访问)
  extra_tokens: ""

channels:
  mode: "auto"
  http:
    enabled: true
    host: "0.0.0.0"
    port: 8550
    timeout_seconds: 30
  file_sync:
    enabled: true
    # 与 Linux 共享同一目录 (Windows 侧为 SMB 挂载或映射盘)
    shared_dir: "${SHARED_DIR}"

failover:
  primary_channel: "http"
  fallback_channel: "file_sync"
  http_max_retries: 3
  http_retry_delay_ms: 1000
  health_check_interval_seconds: 10
  auto_recover_http: true

tdx:
  base_url: "http://127.0.0.1:17709/"
  request_timeout_seconds: 15
  max_retries: 2

sltp_daemon:
  enabled: true
  poll_interval_seconds: 5
  state_file: "./data/stop_loss_state.json"

order_tracking:
  state_file: "./data/active_orders.json"
  sync_interval_seconds: 15
