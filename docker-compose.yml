# Quant-Trader 容器化编排
# 端口布局（与 scripts/alert.sh 探活一致）：
#   mcp-us: 8100-8104   mcp-cn: 8200-8204   mcp-hk: 8300-8304
#   api: 8091   dsh: 3081   ui: 8888
# 常用命令见 README.docker.md
name: baymax

x-python-app: &python-app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./configs:/app/configs
    # 注意：runtime_env*.json / trade_cache.sqlite 不挂载宿主文件——
    # Docker 对缺失的文件源会挂成"目录"，服务直接崩；由 Dockerfile ENTRYPOINT
    # （docker/entrypoint.sh）在容器内从 .example 初始化/创建空文件

services:
  # ---- MCP 服务（三市场独立实例）----
  mcp-us:
    <<: *python-app
    container_name: baymax-mcp-us
    working_dir: /app/agent_tools
    command: python start_mcp_services.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      # agent 工具代码与宿主**同源**（2026-09-15 卷挂载固化）：终结镜像漂移——
      # 容器旧版缺价格保护带/断线自动发现/L2 工具等 12 天改动，宿主为唯一权威。
      # 以后改宿主 agent_tools，容器即时生效，不再需要外科手术式热更新。
      - ./agent_tools:/app/agent_tools
      # agent 工具读 quantdb 日K：此前容器内无此目录，工具回退到陈旧本地源
      # （glm/flash 曾误报"日线仅更新至 08-28"，实际 quantdb 到 09/03）
      - ../projects/quantmind/data/quantdb:/data/quantdb:ro
      # TdxAiData 官方行情库（只读挂载，2026-09-15）：容器内 L2 工具/行情备胎可用
      - /opt/tdx-aidata:/opt/tdx-aidata:ro
    environment:
      MATH_HTTP_PORT: "8100"
      SEARCH_HTTP_PORT: "8101"
      TRADE_HTTP_PORT: "8102"
      GETPRICE_HTTP_PORT: "8103"
      MEMORY_HTTP_PORT: "8104"
      QUANTDB_HTTP_PORT: "8105"
      RUNTIME_ENV_PATH: /app/runtime_env.json
      TDX_AIDATA_DIR: /opt/tdx-aidata
    ports:
      - "8100-8105:8100-8105"

  mcp-cn:
    <<: *python-app
    container_name: baymax-mcp-cn
    working_dir: /app/agent_tools
    command: python start_mcp_services.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./agent_tools:/app/agent_tools     # 与宿主同源（2026-09-15 固化，见 mcp-us 注释）
      - ../projects/quantmind/data/quantdb:/data/quantdb:ro
      - /opt/tdx-aidata:/opt/tdx-aidata:ro # TdxAiData 只读（L2 工具/行情备胎）
    environment:
      MATH_HTTP_PORT: "8200"
      SEARCH_HTTP_PORT: "8201"
      TRADE_HTTP_PORT: "8202"
      GETPRICE_HTTP_PORT: "8203"
      MEMORY_HTTP_PORT: "8204"
      RUNTIME_ENV_PATH: /app/runtime_env_cn.json
      TDX_AIDATA_DIR: /opt/tdx-aidata
    ports:
      - "8200-8204:8200-8204"

  mcp-hk:
    <<: *python-app
    container_name: baymax-mcp-hk
    working_dir: /app/agent_tools
    command: python start_mcp_services.py
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./agent_tools:/app/agent_tools     # 与宿主同源（2026-09-15 固化，见 mcp-us 注释）
      - ../projects/quantmind/data/quantdb:/data/quantdb:ro
    environment:
      MATH_HTTP_PORT: "8300"
      SEARCH_HTTP_PORT: "8301"
      TRADE_HTTP_PORT: "8302"
      GETPRICE_HTTP_PORT: "8303"
      MEMORY_HTTP_PORT: "8304"
      RUNTIME_ENV_PATH: /app/runtime_env_hk.json
    ports:
      - "8300-8304:8300-8304"

  # ---- 后端 API ----
  api:
    <<: *python-app
    container_name: baymax-api
    working_dir: /app
    command: python -m backend.api_server
    environment:
      RUNTIME_ENV_PATH: /app/runtime_env_cn.json
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./config:/app/config
      # 数据平台（可选增强）：quantmind 仓库 parquet 只读直挂。
      # 客户无 quantmind 仓库时 Docker 自动创建空目录，实盘/因子面板自动降级，不阻塞启动
      - /home/zbox/projects/quantmind/data/quantdb:/data/quantdb:ro
      - /home/zbox/projects/quantmind/data/quantus:/data/quantus:ro
      - /home/zbox/projects/quantmind/data/quanthk:/data/quanthk:ro
      - /home/zbox/projects/quantmind/data/quantfutures:/data/quantfutures:ro
    ports:
      - "8091:8091"

  # ---- 交易 agent（按市场独立启动，运行完自动退出）----
  agent-us:
    <<: *python-app
    profiles: ["agents"]
    container_name: baymax-agent-us
    working_dir: /app
    command: python main.py configs/default_config.json
    environment:
      MCP_HOST: mcp-us
      MATH_HTTP_PORT: "8100"
      SEARCH_HTTP_PORT: "8101"
      TRADE_HTTP_PORT: "8102"
      GETPRICE_HTTP_PORT: "8103"
      RUNTIME_ENV_PATH: /app/runtime_env.json
    restart: "no"
    depends_on:
      - mcp-us

  agent-cn:
    <<: *python-app
    profiles: ["agents"]
    container_name: baymax-agent-cn
    working_dir: /app
    command: python main.py configs/astock_config.json
    environment:
      MCP_HOST: mcp-cn
      MATH_HTTP_PORT: "8200"
      SEARCH_HTTP_PORT: "8201"
      TRADE_HTTP_PORT: "8202"
      GETPRICE_HTTP_PORT: "8203"
      RUNTIME_ENV_PATH: /app/runtime_env_cn.json
    restart: "no"
    depends_on:
      - mcp-cn

  agent-hk:
    <<: *python-app
    profiles: ["agents"]
    container_name: baymax-agent-hk
    working_dir: /app
    command: python main.py configs/deepseek_hk_test.json
    environment:
      MCP_HOST: mcp-hk
      MATH_HTTP_PORT: "8300"
      SEARCH_HTTP_PORT: "8301"
      TRADE_HTTP_PORT: "8302"
      GETPRICE_HTTP_PORT: "8303"
      RUNTIME_ENV_PATH: /app/runtime_env_hk.json
    restart: "no"
    depends_on:
      - mcp-hk

  # ---- dsh（DeepSeek Harness，挂 mcp-us 的 5 个工具）----
  # dsh 拒绝绑 0.0.0.0（防 RCE 外露），用 host 网络绑宿主 127.0.0.1:3081，
  # cordis 里 localhost:8100-8104 正好指向宿主上发布的 mcp-us 端口
  # 局域网访问走 dsh-proxy（nginx 绑 DSH_HOST:3081 + basic auth → 127.0.0.1:3081）
  # DSH_HOST 可 .env 覆盖（默认 192.168.31.68）；客户单机场景走 localhost:3081 直连即可
  dsh:
    build:
      context: .
      dockerfile: Dockerfile.dsh
    container_name: baymax-dsh
    network_mode: host
    env_file:
      - path: .env
      - path: .service.env
        required: false    # 客户无 .service.env 也能启动（dsh 面板可初始化）
    environment:
      # 灵枢记忆（@furongjun1999/dsh-memory）的认知图根目录。
      # 其默认值是 `data/mdcg`（**相对 cwd**，cwd 不稳定），且优先级最高的是本环境变量。
      # 指到绑定的 DSH_HOME 下 → 数据随宿主持久化，容器重建不丢（默认落容器本地会丢）。
      # 不设的后果：灵枢桥 spawn 的 python 子进程报「缺少 MDCG_ROOT」→ 0 秒退出 → 永久重试。
      MDCG_ROOT: /root/.dsh/mdcg
      # 灵枢桥 spawn `python -m md_cg.mcp_server` 时**不设 cwd 也不设 PYTHONPATH**，
      # 而 md_cg 随插件一起装在 node_modules 下 → 默认搜索路径找不到，报
      # `ModuleNotFoundError: No module named 'md_cg'` → 进程 0 秒退出、8 次重试后放弃。
      # 这里替它补上模块搜索路径（实测：设了就不报，不设必报）。
      # ⚠️ 路径含插件名，插件改名/换源时需同步。
      PYTHONPATH: /root/.dsh/profiles/web/node_modules/@furongjun1999/dsh-memory
    restart: unless-stopped
    command: dsh --profile web --patch /app/dsh/baymax.cordis.yml --port 3081 --no-open --trusted-host ${DSH_HOST:-192.168.31.68}:3081 --trusted-host ${DSH_HOST:-192.168.31.68}:8093 --trusted-host localhost:8093 --trusted-host 127.0.0.1:8093
    volumes:
      - ./dsh:/app/dsh
      # dsh agent 的工作区（会话 cwd = /root/quantAI，会话桶名 --root-quantAI--）。
      # ⚠️ 必须挂出来：此前它在容器本地文件系统里，任何 `docker compose up -d dsh`
      #    重建都会把它连同 agent 正在用的文件一起抹掉（2026-09-13 实录：抹掉后
      #    容器内 agent 的 bash 全部 spawn 失败报 landlock-run ENOENT——因为 cwd 不存在）。
      - ./dsh/root-quantAI:/root/quantAI
      # dsh agent 执行量化技能：工具/配置/事件缓存只读挂载 → docker cp 进 quantmind 执行
      - ./scripts:/app/quant-scripts:ro
      - ./configs:/app/quant-configs:ro
      - ./data/events:/app/quant-events:ro
      # 交易技能（quantdb 分析/复盘/推荐/新闻情绪/券商 OpenAPI 等 12 个，
      # 来自 quantmind/skills 的规范副本；dsh 用户级技能根目录 = ~/.dsh/skills）
      - ./dsh/skills:/root/.dsh/skills
      # /root/.dsh 持久化（storages=workspace/会话数据, profiles=配置）——
      # 2026-08-31 曾因容器重建未持久化而丢失全部会话；嵌套挂载下
      # /root/.dsh/skills 子挂载优先，仍指向 ./dsh/skills
      - ./dsh/root-dsh:/root/.dsh
      # 总管技能执行环境（可选增强，客户无 quantmind 时 dsh 本体仍可用）：
      #   ① /quantmind 只读挂载 → 技能契约脚本源 `/quantmind/skills/<name>/scripts/`
      #   ② /data 读写 → 报告落盘（quantmind 股票报告页可见）
      #   ③ docker CLI + socket → 技能契约「docker exec quantmind」跑重依赖取数脚本
      - /home/zbox/projects/quantmind:/quantmind:ro
      - /home/zbox/projects/quantmind/data:/data:rw
      # 数据盘新家（2026-09-23）：data 目录已是软链 → /media/zbox/data/quantmind。
      # 容器内按同一绝对路径挂载，保证 /quantmind/data 这条软链在容器内可解析。
      - /media/zbox/data/quantmind:/media/zbox/data/quantmind:rw
      - /usr/bin/docker:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # ---- dsh 访问代理（nginx，basic auth，默认启动）----
  # dsh 本身只绑 127.0.0.1；此容器 host 网络绑 ${DSH_BIND_IP}:3081 与 dsh 的
  # 127.0.0.1:3081 不冲突。默认绑 172.17.0.1（docker 网关）→ bridge 容器
  # （ui-arena 8093）经 host.docker.internal:3081 可达；.env 设 DSH_BIND_IP
  # 为本机局域网 IP 即对局域网开放（如 192.168.31.68）。
  # htpasswd 由 entrypoint 自动生成（默认 admin/admin123），无宿主文件依赖。
  dsh-proxy:
    build: ./dsh/proxy
    container_name: baymax-dsh-proxy
    network_mode: host
    restart: unless-stopped
    environment:
      DSH_BIND_IP: ${DSH_BIND_IP:-172.17.0.1}
    volumes:
      - ./dsh/proxy/nginx.conf.tpl:/etc/nginx/conf.d/dsh.tpl:ro
      # dsh 浏览器鉴权 cookie（dsh 0.1.5 起 web 强制 token/cookie 鉴权；本文件由
      # scripts/dsh_auth_cookie.py 生成。缺失时 entrypoint 会写透传兜底 map，不会起不来）
      - ./dsh/proxy/dsh-cookies.conf:/etc/nginx/conf.d/dsh-cookies.conf:ro

  # ---- Arena 竞技场前端（React 多阶段构建 → nginx，8092）----
  # API token 由 nginx 经 envsubst 注入反代头，浏览器无需持 token。
  # 多阶段构建（arena/Dockerfile）：clone 后 up 即自动编译，无需宿主 Node。
  # 8093 = 交易智能体（dsh 嵌入，basic auth 默认 admin/admin123，entrypoint 自动生成）
  ui-arena:
    build: ./arena
    container_name: baymax-ui-arena
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN}
      # dsh 在宿主 127.0.0.1:3081（host 网络）→ 容器内经 host-gateway 访问宿主
      DSH_UPSTREAM: ${DSH_UPSTREAM:-http://host.docker.internal:3081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8092:8092"
      - "8093:8093"  # 交易智能体（AI-HARNESS 嵌入，同站点端口，basic auth）
    volumes:
      - ./arena/nginx.conf.tpl:/etc/nginx/arena.conf.tpl:ro
      - ./arena/docker-entrypoint.d.sh:/docker-entrypoint.d/05-arena-envsubst.sh:ro
    depends_on:
      - api

  # ---- 个股终端（独立子应用，8094）----
  # 独立容器而非并进 arena 镜像：完全不碰正在服务 8092/8093 的 arena 容器，风险最低，
  # 也符合本仓库既有的「一容器一职责」风格（dsh / dsh-proxy / ui-arena 各自独立）。
  # host 网络：终端要反代到宿主 127.0.0.1:8000 的 quantmind 网关。
  # 源码在 ./stock-terminal（从 /home/zbox/stock-terminal-local 复制而来，原件保留未动）。
  terminal:
    build: ./stock-terminal
    container_name: baymax-terminal
    network_mode: host
    restart: unless-stopped

  # ---- 静态 UI（docs 快照）----
  ui:
    <<: *python-app
    container_name: baymax-ui
    working_dir: /app/docs
    command: python -m http.server 8888
    volumes:
      - ./docs:/app/docs
    ports:
      # 宿主 8888 被 1Panel、8889 被 jupyter-lab 占用，UI 映射到 8887
      - "8887:8888"

  # ---- 数据同步（一次性任务：docker compose --profile datasync run --rm datasync-us）----
  datasync-us:
    <<: *python-app
    profiles: ["datasync"]
    working_dir: /app/data
    command: bash -c "python get_daily_price.py && python merge_jsonl.py"
    restart: "no"

  datasync-cn:
    <<: *python-app
    profiles: ["datasync"]
    working_dir: /app/data/A_stock
    command: bash -c "python get_daily_price_a_stock.py && python merge_a_stock_jsonl.py"
    restart: "no"

  # ---- IBKR Gateway（美股实盘通道；需 IBKR 账号，凭据在 .env） ----
  # 启动: docker compose --profile ibgateway up -d ib-gateway
  # 端口: 4001=实盘 API / 4002=模拟盘 API / 5900=VNC(manual 2FA 用)
  # 2FA: TWS_2FA=device → 容器日志提示后在 IBKR App 确认；TWOFA_TIMEOUT_ACTION=restart
  # BayMax 设置页: 交易所设置 → 盈透证券 → gateway_host=127.0.0.1
  #                 gateway_port=4002(模拟)或4001(实盘), client_id=1
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: baymax-ib-gateway
    profiles: ["ibgateway"]
    restart: unless-stopped
    environment:
      IBKR_USERNAME: ${IBKR_USERNAME:-}
      IBKR_PASSWORD: ${IBKR_PASSWORD:-}
      TRADING_MODE: ${IBKR_TRADING_MODE:-paper}
      TWS_2FA: ${IBKR_TWS_2FA:-device}
      TWOFA_TIMEOUT_ACTION: restart
      IB_GATEWAY_READ_ONLY: "true"
      # 设置目录独立挂载（不能盖 Jts 整目录——jars 在镜像里）
      TWS_SETTINGS_PATH: /home/ibgateway/settings
    ports:
      - "4001:4001"
      - "4002:4002"
      - "5900:5900"
    volumes:
      - ./data/ibgateway-jts:/home/ibgateway/settings
