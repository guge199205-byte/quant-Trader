# Quant-Trader 容器化编排
# 端口布局（与 scripts/alert.sh 探活一致）：
#   mcp-us: 8100-8104   mcp-cn: 8200-8204   mcp-hk: 8300-8304
#   api: 8091   dsh: 3081   ui: 8888
# 常用命令见 README.docker.md
name: baymax

x-python-app: &python-app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  volumes:
    - ./data:/app/data
    - ./logs:/app/logs
    - ./configs:/app/configs
    # 注意：runtime_env*.json / trade_cache.sqlite 不挂载宿主文件——
    # Docker 对缺失的文件源会挂成"目录"，服务直接崩；由 Dockerfile ENTRYPOINT
    # （docker/entrypoint.sh）在容器内从 .example 初始化/创建空文件

services:
  # ---- MCP 服务（三市场独立实例）----
  mcp-us:
    <<: *python-app
    container_name: baymax-mcp-us
    working_dir: /app/agent_tools
    command: python start_mcp_services.py
    environment:
      MATH_HTTP_PORT: "8100"
      SEARCH_HTTP_PORT: "8101"
      TRADE_HTTP_PORT: "8102"
      GETPRICE_HTTP_PORT: "8103"
      MEMORY_HTTP_PORT: "8104"
      RUNTIME_ENV_PATH: /app/runtime_env.json
    ports:
      - "8100-8104:8100-8104"

  mcp-cn:
    <<: *python-app
    container_name: baymax-mcp-cn
    working_dir: /app/agent_tools
    command: python start_mcp_services.py
    environment:
      MATH_HTTP_PORT: "8200"
      SEARCH_HTTP_PORT: "8201"
      TRADE_HTTP_PORT: "8202"
      GETPRICE_HTTP_PORT: "8203"
      MEMORY_HTTP_PORT: "8204"
      RUNTIME_ENV_PATH: /app/runtime_env_cn.json
    ports:
      - "8200-8204:8200-8204"

  mcp-hk:
    <<: *python-app
    container_name: baymax-mcp-hk
    working_dir: /app/agent_tools
    command: python start_mcp_services.py
    environment:
      MATH_HTTP_PORT: "8300"
      SEARCH_HTTP_PORT: "8301"
      TRADE_HTTP_PORT: "8302"
      GETPRICE_HTTP_PORT: "8303"
      MEMORY_HTTP_PORT: "8304"
      RUNTIME_ENV_PATH: /app/runtime_env_hk.json
    ports:
      - "8300-8304:8300-8304"

  # ---- 后端 API ----
  api:
    <<: *python-app
    container_name: baymax-api
    working_dir: /app
    command: python -m backend.api_server
    environment:
      RUNTIME_ENV_PATH: /app/runtime_env_cn.json
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./configs:/app/configs
      - ./config:/app/config
      # 数据平台（可选增强）：quantmind 仓库 parquet 只读直挂。
      # 客户无 quantmind 仓库时 Docker 自动创建空目录，实盘/因子面板自动降级，不阻塞启动
      - /home/zbox/projects/quantmind/data/quantdb:/data/quantdb:ro
      - /home/zbox/projects/quantmind/data/quantus:/data/quantus:ro
      - /home/zbox/projects/quantmind/data/quanthk:/data/quanthk:ro
      - /home/zbox/projects/quantmind/data/quantfutures:/data/quantfutures:ro
    ports:
      - "8091:8091"

  # ---- 交易 agent（按市场独立启动，运行完自动退出）----
  agent-us:
    <<: *python-app
    profiles: ["agents"]
    container_name: baymax-agent-us
    working_dir: /app
    command: python main.py configs/default_config.json
    environment:
      MCP_HOST: mcp-us
      MATH_HTTP_PORT: "8100"
      SEARCH_HTTP_PORT: "8101"
      TRADE_HTTP_PORT: "8102"
      GETPRICE_HTTP_PORT: "8103"
      RUNTIME_ENV_PATH: /app/runtime_env.json
    restart: "no"
    depends_on:
      - mcp-us

  agent-cn:
    <<: *python-app
    profiles: ["agents"]
    container_name: baymax-agent-cn
    working_dir: /app
    command: python main.py configs/astock_config.json
    environment:
      MCP_HOST: mcp-cn
      MATH_HTTP_PORT: "8200"
      SEARCH_HTTP_PORT: "8201"
      TRADE_HTTP_PORT: "8202"
      GETPRICE_HTTP_PORT: "8203"
      RUNTIME_ENV_PATH: /app/runtime_env_cn.json
    restart: "no"
    depends_on:
      - mcp-cn

  agent-hk:
    <<: *python-app
    profiles: ["agents"]
    container_name: baymax-agent-hk
    working_dir: /app
    command: python main.py configs/deepseek_hk_test.json
    environment:
      MCP_HOST: mcp-hk
      MATH_HTTP_PORT: "8300"
      SEARCH_HTTP_PORT: "8301"
      TRADE_HTTP_PORT: "8302"
      GETPRICE_HTTP_PORT: "8303"
      RUNTIME_ENV_PATH: /app/runtime_env_hk.json
    restart: "no"
    depends_on:
      - mcp-hk

  # ---- dsh（DeepSeek Harness，挂 mcp-us 的 5 个工具）----
  # dsh 拒绝绑 0.0.0.0（防 RCE 外露），用 host 网络绑宿主 127.0.0.1:3081，
  # cordis 里 localhost:8100-8104 正好指向宿主上发布的 mcp-us 端口
  # 局域网访问走 dsh-proxy（nginx 绑 DSH_HOST:3081 + basic auth → 127.0.0.1:3081）
  # DSH_HOST 可 .env 覆盖（默认 192.168.31.68）；客户单机场景走 localhost:3081 直连即可
  dsh:
    build:
      context: .
      dockerfile: Dockerfile.dsh
    container_name: baymax-dsh
    network_mode: host
    env_file:
      - path: .env
      - path: .service.env
        required: false    # 客户无 .service.env 也能启动（dsh 面板可初始化）
    restart: unless-stopped
    command: dsh --profile web --patch /app/dsh/baymax.cordis.yml --port 3081 --no-open --trusted-host ${DSH_HOST:-192.168.31.68}:3081 --trusted-host ${DSH_HOST:-192.168.31.68}:8093 --trusted-host localhost:8093 --trusted-host 127.0.0.1:8093
    volumes:
      - ./dsh:/app/dsh
      # 交易技能（quantdb 分析/复盘/推荐/新闻情绪/券商 OpenAPI 等 12 个，
      # 来自 quantmind/skills 的规范副本；dsh 用户级技能根目录 = ~/.dsh/skills）
      - ./dsh/skills:/root/.dsh/skills
      # 总管技能执行环境（可选增强，客户无 quantmind 时 dsh 本体仍可用）：
      #   ① /quantmind 只读挂载 → 技能契约脚本源 `/quantmind/skills/<name>/scripts/`
      #   ② /data 读写 → 报告落盘（quantmind 股票报告页可见）
      #   ③ docker CLI + socket → 技能契约「docker exec quantmind」跑重依赖取数脚本
      - /home/zbox/projects/quantmind:/quantmind:ro
      - /home/zbox/projects/quantmind/data:/data:rw
      - /usr/bin/docker:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock

  # ---- dsh 访问代理（nginx，basic auth，默认启动）----
  # dsh 本身只绑 127.0.0.1；此容器 host 网络绑 ${DSH_BIND_IP}:3081 与 dsh 的
  # 127.0.0.1:3081 不冲突。默认绑 172.17.0.1（docker 网关）→ bridge 容器
  # （ui-arena 8093）经 host.docker.internal:3081 可达；.env 设 DSH_BIND_IP
  # 为本机局域网 IP 即对局域网开放（如 192.168.31.68）。
  # htpasswd 由 entrypoint 自动生成（默认 admin/admin123），无宿主文件依赖。
  dsh-proxy:
    build: ./dsh/proxy
    container_name: baymax-dsh-proxy
    network_mode: host
    restart: unless-stopped
    environment:
      DSH_BIND_IP: ${DSH_BIND_IP:-172.17.0.1}
    volumes:
      - ./dsh/proxy/nginx.conf.tpl:/etc/nginx/conf.d/dsh.tpl:ro

  # ---- Arena 竞技场前端（React 多阶段构建 → nginx，8092）----
  # API token 由 nginx 经 envsubst 注入反代头，浏览器无需持 token。
  # 多阶段构建（arena/Dockerfile）：clone 后 up 即自动编译，无需宿主 Node。
  # 8093 = 交易智能体（dsh 嵌入，basic auth 默认 admin/admin123，entrypoint 自动生成）
  ui-arena:
    build: ./arena
    container_name: baymax-ui-arena
    restart: unless-stopped
    environment:
      API_TOKEN: ${API_TOKEN}
      # dsh 在宿主 127.0.0.1:3081（host 网络）→ 容器内经 host-gateway 访问宿主
      DSH_UPSTREAM: ${DSH_UPSTREAM:-http://host.docker.internal:3081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8092:8092"
      - "8093:8093"  # 交易智能体（AI-HARNESS 嵌入，同站点端口，basic auth）
    volumes:
      - ./arena/nginx.conf.tpl:/etc/nginx/arena.conf.tpl:ro
      - ./arena/docker-entrypoint.d.sh:/docker-entrypoint.d/05-arena-envsubst.sh:ro
    depends_on:
      - api

  # ---- 静态 UI（docs 快照）----
  ui:
    <<: *python-app
    container_name: baymax-ui
    working_dir: /app/docs
    command: python -m http.server 8888
    volumes:
      - ./docs:/app/docs
    ports:
      # 宿主 8888 被 1Panel、8889 被 jupyter-lab 占用，UI 映射到 8887
      - "8887:8888"

  # ---- 数据同步（一次性任务：docker compose --profile datasync run --rm datasync-us）----
  datasync-us:
    <<: *python-app
    profiles: ["datasync"]
    working_dir: /app/data
    command: bash -c "python get_daily_price.py && python merge_jsonl.py"
    restart: "no"

  datasync-cn:
    <<: *python-app
    profiles: ["datasync"]
    working_dir: /app/data/A_stock
    command: bash -c "python get_daily_price_a_stock.py && python merge_a_stock_jsonl.py"
    restart: "no"
