# ---- web 端 cookie 有效期（dsh 0.1.5 起 web 强制 token 鉴权）----
# 0.1.5 给 web 加了强制 token/cookie 鉴权（0.1.1-rc.2 没有），cookie 默认 30 天到期，
# 而 arena 的 /harness 是个 src 写死、不带 token 的 iframe —— 只能靠 cookie 进门。
# 本系统由 dsh-proxy 自动注入一个用持久密钥签发的 cookie（见 dsh/proxy/），
# 把有效期设长，做到「签一次、长期有效」，用户永远不用手动交换 token。
#
# ⚠️ 上限约束（源码 dsh-client-connection authorizeIndex）：
#      expiresAt - issuedAt <= cookieMaxAgeDays * 1天
#    改这里之后必须重跑 scripts/dsh_auth_cookie.sh 重新签发（否则旧 cookie 因超龄被拒）。
#
# ⚠️⚠️ 补丁条目的 `config` 是**整体替换、不是合并**（2026-09-13 实测踩坑）：
#    dsh-web-app 的 cordis.patch.yml 给 connection 设了
#        trustedHosts: !!js ctx.webRuntime.trustedHosts
#    只写 cookieMaxAgeDays 会把 trustedHosts 一起抹掉 → /api 的浏览器信任围栏
#    拒绝所有 LAN authority（192.168.31.68:3081/8093 全 403），首页能开但实时流全断。
#    所以这里必须把原表达式一并重写。
- id: connection
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    cookieMaxAgeDays: 3650
