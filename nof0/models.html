<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型 - Quant-Agent-Trader</title>
    <script>
        // 防主题闪烁：CSS 加载前同步主题背景色
        (function () {
            var t = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.backgroundColor = t === 'dark' ? '#0a0a0a' : '#ffffff';
        })();
    </script>
    <link rel="stylesheet" href="assets/css/nof0-styles.css?v20260830b">
    <script src="assets/js/vendor/chart.umd.min.js?v20260830"></script>
    <link rel="prefetch" href="index.html">
    <link rel="prefetch" href="portfolio.html">
    <style>
        /* ===== 模型页紧凑布局 ===== */
        .md-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
            padding: 0 1.5rem;
            margin-bottom: 0.75rem;
        }
        .md-stat {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.65rem 0.9rem;
            min-width: 0;
        }
        .md-stat .label { font-size: 0.7rem; color: var(--gray-400, #888); margin-bottom: 0.2rem; }
        .md-stat .value { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
        .md-stat .sub { font-size: 0.68rem; color: var(--gray-400, #888); margin-top: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pos { color: #10b981; } .neg { color: #ef4444; }

        /* 模型卡片网格 */
        .md-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 0.75rem;
            padding: 0 1.5rem 1.5rem;
        }
        .md-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            position: relative;
            overflow: hidden;
        }
        .md-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--card-accent, var(--glass-border));
        }
        .md-card-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.6rem; }
        .md-card-head img { width: 1.6rem; height: 1.6rem; border-radius: 4px; }
        .md-card-head .name { font-weight: 600; font-size: 0.9rem; }
        .md-card-head .badge {
            margin-left: auto; font-size: 0.65rem; padding: 0.15rem 0.5rem;
            border-radius: 20px; border: 1px solid var(--glass-border);
            color: var(--gray-400, #888);
        }
        .md-card .equity { font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 0.3rem; }
        .md-card .equity small { font-size: 0.7rem; font-weight: 400; color: var(--gray-400, #888); }
        .md-card .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.35rem 0.6rem;
            font-size: 0.72rem;
        }
        .md-card .metrics .m { display: flex; justify-content: space-between; }
        .md-card .metrics .m .k { color: var(--gray-400, #888); }
        .md-card .metrics .m .v { font-variant-numeric: tabular-nums; font-weight: 500; }
        .md-card .status {
            margin-top: 0.55rem; padding-top: 0.5rem;
            border-top: 1px solid var(--glass-border);
            font-size: 0.68rem; color: var(--gray-400, #888);
            display: flex; justify-content: space-between;
        }
        .empty { padding: 3rem; text-align: center; color: var(--gray-400, #888); }

        /* 响应式 */
        @media (max-width: 900px) { .md-stats { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 480px) {
            .md-stats, .md-grid { padding-left: 0.6rem; padding-right: 0.6rem; }
            .md-stats { gap: 0.5rem; }
            .md-card { padding: 0.75rem; }
            .header-brand h1 { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="header-brand"><h1>Quant-Agent-Trader</h1></div>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">实盘</a>
                <a href="portfolio.html" class="nav-link">排行榜</a>
                <a href="models.html" class="nav-link active">模型</a>
                <a href="monitor.html" class="nav-link">总控</a>
            </nav>
            <div class="header-actions">
                <div class="market-selector">
                    <button id="usMarketBtn" class="market-btn active" data-market="us">🇺🇸 美股</button>
                    <button id="cnMarketBtn" class="market-btn" data-market="cn">🇨🇳 A股</button>
                    <button id="hkMarketBtn" class="market-btn" data-market="hk">🇭🇰 港股</button>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    <svg class="theme-icon light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14" height="14">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.22"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="theme-icon dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14" height="14">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <!-- 统计条 -->
        <section class="md-stats">
            <div class="md-stat"><div class="label">模型数量</div><div class="value" id="statCount">--</div><div class="sub" id="statCountSub"></div></div>
            <div class="md-stat"><div class="label">总权益</div><div class="value" id="statEquity">--</div><div class="sub">全部模型合计</div></div>
            <div class="md-stat"><div class="label">平均收益率</div><div class="value" id="statAvg">--</div><div class="sub">全体模型均值</div></div>
            <div class="md-stat"><div class="label">✅ 盈利模型</div><div class="value" id="statWin">--</div><div class="sub" id="statWinSub"></div></div>
        </section>

        <!-- 模型卡片 -->
        <section class="md-grid" id="modelGrid">
            <div class="empty">加载中...</div>
        </section>
    </main>

    <script src="assets/js/config-loader.js?v20260830"></script>
    <script src="assets/js/theme.js?v20260830"></script>
    <script>
        const state = { market: 'us' };

        async function getApiBase() {
            if (window.configLoader) {
                try {
                    await window.configLoader.loadConfig();
                    const p = window.configLoader.getDataPath();
                    if (p && p.startsWith('http')) return p.replace(/\/api\/data$/, '/api');
                } catch (e) { /* fallback */ }
            }
            return 'http://192.168.31.68:8091/api';
        }

        let apiToken = '';
        async function getApiToken() {
            if (!apiToken && window.configLoader && window.configLoader.getApiToken) {
                apiToken = window.configLoader.getApiToken();
            }
            return apiToken;
        }
        function authHeaders() {
            const t = apiToken || '';
            return t ? { 'X-API-Token': t } : {};
        }

        function fmtMoney(v, isCN) { const s = isCN ? '¥' : (state.market === 'hk' ? 'HK$' : '$'); return s + Number(v || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 }); }
        function fmtPct(v) { const n = Number(v || 0); return (n >= 0 ? '+' : '') + (n * 100).toFixed(2) + '%'; }
        function pctClass(v) { return Number(v || 0) >= 0 ? 'pos' : 'neg'; }

        function agentMeta(name) {
            const mc = window.configLoader && window.configLoader.getMarketConfig
                ? window.configLoader.getMarketConfig(state.market) : null;
            const ag = mc && mc.agents ? mc.agents.find(x => x.folder === name) : null;
            return {
                display: ag ? ag.display_name : name,
                icon: ag ? ag.icon : '',
                color: ag ? (ag.color || '#888') : '#888',
            };
        }

        async function refresh() {
            const isCN = state.market === 'cn';
            const api = await getApiBase();
            const resp = await fetch(`${api}/agents?market=${state.market}`, { headers: authHeaders() });
            const data = await resp.json();
            const agents = (data.data || []).filter(a => a.has_position);

            const cards = [];
            let totalEquity = 0, totalInit = 0, winCount = 0;
            for (const a of agents) {
                const pr = await fetch(`${api}/agents/${encodeURIComponent(a.name)}/performance`, { headers: authHeaders() });
                if (!pr.ok) continue;
                const pd = await pr.json();
                const perf = pd.data;
                if (!perf) continue;
                const s = perf.summary;
                totalEquity += s.end_equity || 0;
                totalInit += s.start_equity || 0;
                if ((s.total_return || 0) > 0) winCount++;
                cards.push({ name: a.name, latest: a.latest_date, cash: a.cash, perf: perf });
            }
            cards.sort((x, y) => (y.perf.summary.total_return || 0) - (x.perf.summary.total_return || 0));

            // 统计条
            document.getElementById('statCount').textContent = cards.length;
            document.getElementById('statCountSub').textContent = state.market === 'cn' ? 'A股（上证50）' : '美股（纳斯达克100）';
            document.getElementById('statEquity').textContent = fmtMoney(totalEquity, isCN);
            const avg = cards.length ? cards.reduce((s, r) => s + (r.perf.summary.total_return || 0), 0) / cards.length : 0;
            const avgEl = document.getElementById('statAvg');
            avgEl.textContent = fmtPct(avg);
            avgEl.className = 'value ' + pctClass(avg);
            document.getElementById('statWin').textContent = winCount + '/' + cards.length;
            document.getElementById('statWinSub').textContent = cards.length ? '胜率 ' + Math.round(winCount / cards.length * 100) + '%' : '';

            // 模型卡片
            const grid = document.getElementById('modelGrid');
            if (!cards.length) {
                grid.innerHTML = '<div class="empty">暂无模型数据，运行 agent 后自动出现</div>';
                return;
            }
            grid.innerHTML = cards.map(r => {
                const m = agentMeta(r.name);
                const s = r.perf.summary;
                const last = r.perf.points[r.perf.points.length - 1];
                const wins = (s.total_return || 0) >= 0;
                const trades = (r.perf.points || []).filter(p => p.action).length;
                return `<div class="md-card" style="--card-accent:${m.color}">
                    <div class="md-card-head">
                        ${m.icon ? `<img src="${m.icon}" onerror="this.style.display='none'">` : `<span class="model-dot" style="width:1.4rem;height:1.4rem;border-radius:50%;background:${m.color}"></span>`}
                        <span class="name">${m.display}</span>
                        <span class="badge">${wins ? '盈利' : '亏损'}</span>
                    </div>
                    <div class="equity">${fmtMoney(s.end_equity, isCN)} <small>${wins ? '+' : ''}${((s.total_return || 0) * 100).toFixed(2)}%</small></div>
                    <div class="metrics">
                        <div class="m"><span class="k">初始资金</span><span class="v">${fmtMoney(s.start_equity, isCN)}</span></div>
                        <div class="m"><span class="k">最大回撤</span><span class="v neg">-${(s.max_drawdown * 100).toFixed(2)}%</span></div>
                        <div class="m"><span class="k">交易次数</span><span class="v">${trades}</span></div>
                        <div class="m"><span class="k">持仓市值</span><span class="v">${fmtMoney(last ? last.market_value : 0, isCN)}</span></div>
                    </div>
                    <div class="status">
                        <span>现金 ${fmtMoney(r.cash ?? 0, isCN)}</span>
                        <span>截至 ${r.latest ? String(r.latest).slice(0, 10) : '--'}</span>
                    </div>
                </div>`;
            }).join('');
        }

        // 市场切换
        document.querySelectorAll('.market-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.market-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.market = btn.dataset.market;
                document.getElementById('modelGrid').innerHTML = '<div class="empty">加载中...</div>';
                refresh();
            });
        });

        // 启动
        (async function init() {
            // 确保 ConfigLoader 实例存在（本页为自包含实现，不依赖旧页面 JS）
            if (!window.configLoader && window.ConfigLoader) {
                window.configLoader = new window.ConfigLoader();
            }
            if (window.configLoader) { await window.configLoader.loadConfig().catch(() => {}); await getApiToken(); }
            if (window.ThemeManager) new window.ThemeManager();
            refresh();
            setInterval(refresh, 30000);
        })();
    </script>
</body>
</html>
