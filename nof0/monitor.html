<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总控台 - Trade Agent</title>
    <script>
        // 防主题闪烁
        (function () {
            var t = localStorage.getItem('theme') ||
                (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.backgroundColor = t === 'dark' ? '#0a0a0a' : '#ffffff';
        })();
    </script>
    <link rel="stylesheet" href="assets/css/nof0-styles.css?v20260830">
    <style>
        .mon-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1.5rem; }
        .mon-title h1 { font-size: 1.15rem; margin: 0; }
        .mon-title p { margin: 0; font-size: 0.72rem; color: var(--gray-400, #888); }

        /* 服务健康条 */
        .svc-row { display: flex; gap: 0.5rem; padding: 0 1.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .svc-chip {
            display: flex; align-items: center; gap: 0.4rem;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 0.3rem 0.8rem; font-size: 0.75rem;
        }
        .svc-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; }
        .svc-up { background: #10b981; }
        .svc-down { background: #ef4444; }

        /* 市场区块 */
        .mk-section { margin: 0 1.5rem 1rem; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; overflow: hidden; }
        .mk-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 1rem; border-bottom: 1px solid var(--glass-border); font-size: 0.85rem; font-weight: 600; }
        .mk-head .count { margin-left: auto; font-size: 0.7rem; font-weight: 400; color: var(--gray-400, #888); }
        .mk-table { width: 100%; border-collapse: collapse; }
        .mk-table th { text-align: left; font-size: 0.68rem; color: var(--gray-400, #888); padding: 0.4rem 1rem; border-bottom: 1px solid var(--glass-border); font-weight: 500; }
        .mk-table td { padding: 0.4rem 1rem; font-size: 0.78rem; border-bottom: 1px solid var(--glass-border); font-variant-numeric: tabular-nums; }
        .mk-table tr:last-child td { border-bottom: none; }
        .pos { color: #10b981; } .neg { color: #ef4444; }
        .status-badge { font-size: 0.65rem; padding: 0.12rem 0.5rem; border-radius: 10px; border: 1px solid var(--glass-border); }

        .empty { padding: 1.5rem; text-align: center; color: var(--gray-400, #888); font-size: 0.8rem; }
        .refresh-note { text-align: center; font-size: 0.68rem; color: var(--gray-400, #888); padding-bottom: 1rem; }

        @media (max-width: 480px) {
            .mon-header, .svc-row, .mk-section { margin-left: 0.6rem; margin-right: 0.6rem; }
            .svc-row, .mon-header { padding-left: 0; padding-right: 0; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="header-brand"><h1>Trade Agent</h1></div>
            <nav class="header-nav">
                <a href="index.html" class="nav-link">实盘</a>
                <a href="portfolio.html" class="nav-link">排行榜</a>
                <a href="models.html" class="nav-link">模型</a>
                <a href="monitor.html" class="nav-link active">总控</a>
            </nav>
            <div class="header-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                    <svg class="theme-icon light-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14" height="14">
                        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.22"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="theme-icon dark-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" width="14" height="14">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main>
        <div class="mon-header">
            <div class="mon-title">
                <h1>总控台</h1>
                <p id="lastRefresh">正在加载...</p>
            </div>
        </div>

        <!-- 服务健康 -->
        <div class="svc-row" id="svcRow"></div>

        <!-- 市场区块：美股 / A股 / 港股 -->
        <div id="marketSections"></div>

        <div class="refresh-note">每 30 秒自动刷新 · 告警日志：/home/zbox/backups/baymax/alerts.log</div>
    </main>

    <script src="assets/js/config-loader.js?v20260830"></script>
    <script src="assets/js/theme.js?v20260830"></script>
    <script>
        const MARKET_META = {
            us: { name: '🇺🇸 美股市场（纳斯达克100）', cur: '$' },
            cn: { name: '🇨🇳 A股市场（上证50）', cur: '¥' },
            hk: { name: '🇭🇰 港股市场（恒生指数）', cur: 'HK$' },
        };

        let apiToken = '';
        async function getApi() {
            if (!window.configLoader) return { base: 'http://192.168.31.68:8091/api', token: '' };
            try {
                await window.configLoader.loadConfig().catch(() => {});
                const p = window.configLoader.getDataPath();
                apiToken = window.configLoader.getApiToken ? window.configLoader.getApiToken() : '';
                return {
                    base: p && p.startsWith('http') ? p.replace(/\/api\/data$/, '/api') : 'http://192.168.31.68:8091/api',
                    token: apiToken,
                };
            } catch (e) {
                return { base: 'http://192.168.31.68:8091/api', token: '' };
            }
        }

        function authHeaders() { return apiToken ? { 'X-API-Token': apiToken } : {}; }
        function fmtMoney(v, cur) { return cur + Number(v || 0).toLocaleString('zh-CN', { maximumFractionDigits: 0 }); }
        function fmtPct(v) { const n = Number(v || 0); return (n >= 0 ? '+' : '') + (n * 100).toFixed(2) + '%'; }
        function pctClass(v) { return Number(v || 0) >= 0 ? 'pos' : 'neg'; }

        async function refresh() {
            const { base } = await getApi();

            // 服务健康 + 指标
            const [metricsResp, overviewResp] = await Promise.all([
                fetch(`${base}/metrics`, { headers: authHeaders() }),
                fetch(`${base}/overview`, { headers: authHeaders() }),
            ]);
            const metrics = (await metricsResp.json()).data || {};
            const overview = (await overviewResp.json()).data || { markets: {} };

            // 服务条
            const svcNames = { api: 'API', mcp_us: '美股MCP', mcp_cn: 'A股MCP', mcp_hk: '港股MCP', dsh: 'dsh引擎' };
            document.getElementById('svcRow').innerHTML = Object.entries(metrics.services || {})
                .map(([k, v]) => `<span class="svc-chip"><span class="svc-dot ${v === 'up' ? 'svc-up' : 'svc-down'}"></span>${svcNames[k] || k} ${v === 'up' ? '正常' : '掉线'}</span>`)
                .join('');

            // 市场区块
            const sections = document.getElementById('marketSections');
            sections.innerHTML = Object.entries(MARKET_META).map(([mk, meta]) => {
                const agents = (overview.markets || {})[mk] || [];
                const running = agents.filter(a => a.summary).length;
                const rows = agents.length ? agents.map(a => {
                    const s = a.summary;
                    const status = s ? '<span class="status-badge" style="color:#10b981">已交易</span>'
                        : '<span class="status-badge" style="color:var(--gray-400,#888)">未交易</span>';
                    return `<tr>
                        <td>${a.name}</td>
                        <td>${s ? fmtMoney(s.end_equity, meta.cur) : '--'}</td>
                        <td class="${s ? pctClass(s.total_return) : ''}">${s ? fmtPct(s.total_return) : '--'}</td>
                        <td class="neg">${s ? '-' + (s.max_drawdown * 100).toFixed(2) + '%' : '--'}</td>
                        <td>${a.records}</td>
                        <td>${a.latest_date ? String(a.latest_date).slice(0, 10) : '--'}</td>
                        <td>${status}</td>
                    </tr>`;
                }).join('') : '<tr><td colspan="7" class="empty">暂无 agent 数据</td></tr>';
                return `<section class="mk-section">
                    <div class="mk-head">${meta.name}<span class="count">${running}/${agents.length} 个已交易</span></div>
                    <table class="mk-table">
                        <thead><tr><th>Agent</th><th>当前权益</th><th>收益率</th><th>最大回撤</th><th>记录数</th><th>最新日期</th><th>状态</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                </section>`;
            }).join('');

            const age = metrics.latest_trade_age_sec;
            const ageText = age == null ? '无交易记录'
                : age < 3600 ? `${Math.floor(age / 60)} 分钟前` : `${Math.floor(age / 3600)} 小时前`;
            document.getElementById('lastRefresh').textContent =
                `更新于 ${new Date().toLocaleTimeString('zh-CN')} · 最近交易 ${ageText}`;
        }

        // 启动
        (async function init() {
            if (!window.configLoader && window.ConfigLoader) window.configLoader = new window.ConfigLoader();
            if (window.ThemeManager) new window.ThemeManager();
            refresh();
            setInterval(refresh, 30000);
        })();
    </script>
</body>
</html>
