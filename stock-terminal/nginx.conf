# 个股终端 nginx：静态托管 + 反代到 quantmind 网关
#
# 等价于原项目 vite.config.ts 里的 dev 代理：
#   '/api'    -> http://127.0.0.1:8000  (ws: true)
#   '/health' -> http://127.0.0.1:8000
# 另加 /ws 前缀（见下）。
#
# ⚠️ WebSocket 的路径不是 /api/v1/ws/market，而是 **/ws/api/v1/ws/market**：
#    终端源码 getWebSocketUrl() 在「浏览器 + 基址为空」时走
#    `${location.host}/ws/api/v1/ws/market` 分支。所以这里用带尾斜杠的 proxy_pass
#    把 /ws 前缀**剥掉**再转给网关，落到网关的 /api/v1/ws/market。

# 本文件被 include 在 http{} 上下文里，故 map 合法。
# 只在确实要升级时送 Connection: upgrade，否则送 close（硬编码 upgrade 会让普通请求也声称升级）。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8094;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 终端用的是 HashRouter（#/...），无服务端路由，回退到 index.html 即可
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTTP API：/api/... 原样转发（终端按 <origin>/api/v1/... 组装路径）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # 网关同一路径也承载 WS，保留升级头
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # WebSocket：剥掉 /ws 前缀
    #   /ws/api/v1/ws/market -> http://127.0.0.1:8000/api/v1/ws/market
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
